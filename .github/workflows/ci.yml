name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Run over the synthetic demo data
        run: python3 -m arcturion_flywheel --agents-root examples/demo/agents --ledger examples/demo/approvals-ledger.ndjson --out flywheel-out
